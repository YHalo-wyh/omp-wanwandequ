name: Wanwandequ Studio CI

on:
  push:
    branches:
      - "wq/studio-*"
      - main
    paths:
      - "packages/wanwandequ-studio/**"
      - "packages/coding-agent/src/wq/events.ts"
      - "packages/coding-agent/src/wq/scheduler.ts"
      - "packages/coding-agent/test/wq-events.test.ts"
      - ".github/workflows/wq-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wq-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Studio Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: powershell
        run: bun install --ignore-scripts
      - name: Type check Wanwandequ runtime
        shell: powershell
        run: bun --cwd=packages/coding-agent run check:types
      - name: Test observer event log
        shell: powershell
        run: bun test packages/coding-agent/test/wq-events.test.ts
      - name: Build Studio frontend
        shell: powershell
        run: bun --cwd=packages/wanwandequ-studio run build:web
      - name: Stage bundled Wanwandequ agent
        shell: powershell
        run: |
          $dir = "packages/wanwandequ-studio/src-tauri/binaries"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $url = "https://github.com/YHalo-wyh/omp-wanwandequ/releases/download/wq-dev/omp-wanwandequ-windows-x64.exe"
          & curl.exe -fL --retry 4 --retry-delay 2 --connect-timeout 20 -o "$dir/omp-wanwandequ-x86_64-pc-windows-msvc.exe" $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Studio Rust backend
        shell: powershell
        run: cargo check --manifest-path packages/wanwandequ-studio/src-tauri/Cargo.toml
      - name: Build Studio installer
        shell: powershell
        run: bun --cwd=packages/wanwandequ-studio run studio:build
      - name: Stage installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist-studio | Out-Null
          $src = Get-ChildItem "packages/wanwandequ-studio/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $src) { throw "Studio NSIS installer not found" }
          Copy-Item $src.FullName "dist-studio/Wanwandequ-Studio-Setup-Windows-x64.exe"
          $hash = (Get-FileHash "dist-studio/Wanwandequ-Studio-Setup-Windows-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Wanwandequ-Studio-Setup-Windows-x64.exe" | Set-Content "dist-studio/Wanwandequ-Studio-Setup-Windows-x64.exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wanwandequ-studio-windows-x64
          path: dist-studio/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish studio-dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/wq/studio-')
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wanwandequ-studio-windows-x64
          path: dist
      - name: Publish rolling Studio release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete studio-dev --repo "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create studio-dev dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Wanwandequ Studio rolling dev" \
            --notes "Wanwandequ Studio v0.3: full Chinese IDE UI, real clickable workspace explorer, PTY-backed conversation composer, native terminal fallback, tool/context observer panels, and direct Wanwandequ API/token/provider/preset configuration without changing the OMP Agent execution chain." \
            --prerelease
