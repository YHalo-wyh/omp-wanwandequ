name: Wanwandequ Studio CI

on:
  push:
    branches:
      - "wq/studio-*"
      - "wq/runtime-*"
      - main
    paths:
      - "packages/wanwandequ-studio/**"
      - "packages/coding-agent/src/wq/**"
      - "packages/coding-agent/src/wanwandequ-cli.ts"
      - "packages/coding-agent/test/wq-*.test.ts"
      - "scripts/ci-release-build-wanwandequ.ts"
      - ".github/workflows/wq-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wq-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Studio Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: powershell
        run: bun install --ignore-scripts
      - name: Type check Wanwandequ runtime
        shell: powershell
        run: bun --cwd=packages/coding-agent run check:types
      - name: Test WQ observer and Studio RPC adapter
        shell: powershell
        run: |
          bun test packages/coding-agent/test/wq-events.test.ts
          bun test packages/wanwandequ-studio/src/runtime-protocol.test.ts
      - name: Build Studio frontend
        shell: powershell
        run: bun --cwd=packages/wanwandequ-studio run build:web
      - name: Stage Windows native addon for current Agent build
        shell: powershell
        run: |
          $version = node -p "require('./packages/natives/package.json').version"
          $package = "@oh-my-pi/pi-natives-win32-x64@$version"
          $tarball = (npm view $package dist.tarball).Trim()
          $tmp = Join-Path $env:RUNNER_TEMP "wq-native"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $tmp | Out-Null
          New-Item -ItemType Directory -Force "packages/natives/native" | Out-Null
          & curl.exe -fL --retry 3 -o "$tmp/native.tgz" $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xzf "$tmp/native.tgz" -C $tmp
          Copy-Item "$tmp/package/pi_natives.win32-x64*.node" "packages/natives/native/" -Force
      - name: Build bundled Wanwandequ Agent from this commit
        shell: powershell
        run: |
          bun scripts/ci-release-build-wanwandequ.ts --targets win32-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = "packages/wanwandequ-studio/src-tauri/binaries"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "packages/coding-agent/binaries/omp-wanwandequ-windows-x64.exe" "$dir/omp-wanwandequ-x86_64-pc-windows-msvc.exe" -Force
      - name: Smoke test Wanwandequ native RPC
        shell: powershell
        run: |
          $exe = (Resolve-Path "packages/coding-agent/binaries/omp-wanwandequ-windows-x64.exe").Path
          $help = (& $exe help 2>&1 | Out-String)
          if ($help -notmatch "headless JSONL RPC runtime") { throw "runtime command missing from bundled Agent" }

          $env:DEEPSEEK_API_KEY = "ci-smoke-placeholder"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.ArgumentList.Add("runtime")
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $psi
          if (-not $process.Start()) { throw "failed to start runtime" }
          try {
            $readyTask = $process.StandardOutput.ReadLineAsync()
            if (-not $readyTask.Wait(20000)) { throw "runtime ready frame timed out: $($process.StandardError.ReadToEnd())" }
            $ready = $readyTask.Result
            if ($ready -notmatch '"type":"ready"') { throw "unexpected first runtime frame: $ready" }
            $process.StandardInput.WriteLine('{"id":"ci-state","type":"get_state"}')
            $process.StandardInput.Flush()
            $stateTask = $process.StandardOutput.ReadLineAsync()
            if (-not $stateTask.Wait(10000)) { throw "get_state response timed out" }
            $state = $stateTask.Result
            if ($state -notmatch '"command":"get_state"' -or $state -notmatch '"success":true') { throw "unexpected get_state response: $state" }
          } finally {
            if (-not $process.HasExited) { $process.Kill($true) }
          }
      - name: Check Studio Rust backend
        shell: powershell
        run: cargo check --manifest-path packages/wanwandequ-studio/src-tauri/Cargo.toml
      - name: Build Studio installer
        shell: powershell
        run: bun --cwd=packages/wanwandequ-studio run studio:build
      - name: Stage installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist-studio | Out-Null
          $src = Get-ChildItem "packages/wanwandequ-studio/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $src) { throw "Studio NSIS installer not found" }
          Copy-Item $src.FullName "dist-studio/Wanwandequ-Studio-Setup-Windows-x64.exe"
          $hash = (Get-FileHash "dist-studio/Wanwandequ-Studio-Setup-Windows-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Wanwandequ-Studio-Setup-Windows-x64.exe" | Set-Content "dist-studio/Wanwandequ-Studio-Setup-Windows-x64.exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wanwandequ-studio-windows-x64
          path: dist-studio/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish studio-dev
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/wq/studio-') || startsWith(github.ref, 'refs/heads/wq/runtime-'))
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wanwandequ-studio-windows-x64
          path: dist
      - name: Publish rolling Studio release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete studio-dev --repo "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create studio-dev dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Wanwandequ Studio rolling dev" \
            --notes "Wanwandequ Studio v0.4 Runtime-first: Studio talks to OMP AgentSession through the native JSONL RPC protocol instead of PTY/TUI scraping. Structured chat, tool events, Subagent events, context state and extension UI requests are surfaced without replacing OMP tools/MCP/skills/task/compaction. Competition mode remains a separate headless omp-wanwandequ run process." \
            --prerelease
