name: WQ Competition CI

on:
  push:
    branches:
      - main
      - "wq/**"
    paths:
      - "packages/coding-agent/src/wq/**"
      - "packages/coding-agent/src/wanwandequ-cli.ts"
      - "packages/coding-agent/src/prompts/agents/wq-*.md"
      - "packages/coding-agent/src/prompts/skills/wanwandequ-*/**"
      - "packages/coding-agent/src/task/agents.ts"
      - "packages/coding-agent/src/commands/wq.ts"
      - "packages/coding-agent/src/cli-commands.ts"
      - "packages/coding-agent/src/cli/command-help.ts"
      - "packages/coding-agent/test/wq-*.test.ts"
      - "scripts/ci-release-build-wanwandequ.ts"
      - "scripts/install-wanwandequ.*"
      - "WANWANDEQU.md"
      - ".github/workflows/wq-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/coding-agent/src/wq/**"
      - "packages/coding-agent/src/wanwandequ-cli.ts"
      - "packages/coding-agent/src/prompts/agents/wq-*.md"
      - "packages/coding-agent/src/prompts/skills/wanwandequ-*/**"
      - "packages/coding-agent/src/task/agents.ts"
      - "packages/coding-agent/src/commands/wq.ts"
      - "packages/coding-agent/src/cli-commands.ts"
      - "packages/coding-agent/src/cli/command-help.ts"
      - "packages/coding-agent/test/wq-*.test.ts"
      - "scripts/ci-release-build-wanwandequ.ts"
      - "scripts/install-wanwandequ.*"
      - "WANWANDEQU.md"
      - ".github/workflows/wq-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: WQ typecheck and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Type check coding agent
        run: bun --cwd=packages/coding-agent run check:types
      - name: Run WQ focused tests
        run: bun test packages/coding-agent/test/wq-*.test.ts
      - name: Verify branded release build plan
        run: bun scripts/ci-release-build-wanwandequ.ts --dry-run --targets linux-x64,win32-x64

  windows_binary:
    name: Build Windows x64 competition binary
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Stage matching Windows native addon
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/natives/package.json').version")"
          package="@oh-my-pi/pi-natives-win32-x64@${version}"
          tarball="$(npm view "$package" dist.tarball)"
          echo "Fetching $package from $tarball"
          rm -rf "$RUNNER_TEMP/wq-win-native"
          mkdir -p "$RUNNER_TEMP/wq-win-native" packages/natives/native
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP/wq-win-native"
          cp "$RUNNER_TEMP"/wq-win-native/package/pi_natives.win32-x64*.node packages/natives/native/
          test -f packages/natives/native/pi_natives.win32-x64-baseline.node
          ls -lh packages/natives/native/pi_natives.win32-x64*.node
      - name: Build omp-wanwandequ Windows x64
        run: bun scripts/ci-release-build-wanwandequ.ts --targets win32-x64
      - name: Upload competition binary
        uses: actions/upload-artifact@v4
        with:
          name: omp-wanwandequ-windows-x64
          path: packages/coding-agent/binaries/omp-wanwandequ-windows-x64.exe
          if-no-files-found: error
          retention-days: 7
