name: WQ Competition CI

on:
  push:
    branches:
      - main
      - "wq/**"
    paths:
      - "packages/coding-agent/src/wq/**"
      - "packages/coding-agent/src/wanwandequ-cli.ts"
      - "packages/coding-agent/src/prompts/agents/wq-*.md"
      - "packages/coding-agent/src/prompts/skills/wanwandequ-*/**"
      - "packages/coding-agent/src/task/agents.ts"
      - "packages/coding-agent/src/commands/wq.ts"
      - "packages/coding-agent/src/cli-commands.ts"
      - "packages/coding-agent/src/cli/command-help.ts"
      - "packages/coding-agent/test/wq-*.test.ts"
      - "scripts/ci-release-build-wanwandequ.ts"
      - "scripts/install-wanwandequ.*"
      - "installer/**"
      - "WANWANDEQU.md"
      - ".github/workflows/wq-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/coding-agent/src/wq/**"
      - "packages/coding-agent/src/wanwandequ-cli.ts"
      - "packages/coding-agent/src/prompts/agents/wq-*.md"
      - "packages/coding-agent/src/prompts/skills/wanwandequ-*/**"
      - "packages/coding-agent/src/task/agents.ts"
      - "packages/coding-agent/src/commands/wq.ts"
      - "packages/coding-agent/src/cli-commands.ts"
      - "packages/coding-agent/src/cli/command-help.ts"
      - "packages/coding-agent/test/wq-*.test.ts"
      - "scripts/ci-release-build-wanwandequ.ts"
      - "scripts/install-wanwandequ.*"
      - "installer/**"
      - "WANWANDEQU.md"
      - ".github/workflows/wq-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: WQ typecheck and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Type check coding agent
        run: bun --cwd=packages/coding-agent run check:types
      - name: Run WQ focused tests
        run: bun test packages/coding-agent/test/wq-*.test.ts
      - name: Verify all release targets
        run: bun scripts/ci-release-build-wanwandequ.ts --dry-run --targets linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64,win32-arm64

  binaries:
    name: Build ${{ matrix.id }} binary
    needs: validate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            asset: omp-wanwandequ-linux-x64
          - id: linux-arm64
            asset: omp-wanwandequ-linux-arm64
          - id: darwin-x64
            asset: omp-wanwandequ-darwin-x64
          - id: darwin-arm64
            asset: omp-wanwandequ-darwin-arm64
          - id: win32-x64
            asset: omp-wanwandequ-windows-x64.exe
          - id: win32-arm64
            asset: omp-wanwandequ-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Stage matching native addon
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/natives/package.json').version")"
          package="@oh-my-pi/pi-natives-${TARGET_ID}@${version}"
          tarball="$(npm view "$package" dist.tarball)"
          echo "Fetching $package from $tarball"
          rm -rf "$RUNNER_TEMP/wq-native"
          mkdir -p "$RUNNER_TEMP/wq-native" packages/natives/native
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP/wq-native"
          cp "$RUNNER_TEMP"/wq-native/package/pi_natives.${TARGET_ID}*.node packages/natives/native/
          compgen -G "packages/natives/native/pi_natives.${TARGET_ID}*.node" >/dev/null
      - name: Build target
        run: bun scripts/ci-release-build-wanwandequ.ts --targets ${{ matrix.id }}
      - name: Generate checksum
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          cd packages/coding-agent/binaries
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wq-bin-${{ matrix.id }}
          path: |
            packages/coding-agent/binaries/${{ matrix.asset }}
            packages/coding-agent/binaries/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  windows_installer:
    name: Build click-to-install Windows setup
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wq-bin-win32-x64
          path: dist-bin
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer\dist | Out-Null
          $bin = (Resolve-Path 'dist-bin\omp-wanwandequ-windows-x64.exe').Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DWinBinary=$bin" 'installer\windows.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash installer\dist\OMP-Wanwandequ-Setup-Windows-x64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  OMP-Wanwandequ-Setup-Windows-x64.exe" } |
            Set-Content installer\dist\OMP-Wanwandequ-Setup-Windows-x64.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wq-installer-windows-x64
          path: |
            installer/dist/OMP-Wanwandequ-Setup-Windows-x64.exe
            installer/dist/OMP-Wanwandequ-Setup-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish rolling wq-dev release
    if: github.event_name == 'push' && github.ref == 'refs/heads/wq/competition-v1'
    needs: [binaries, windows_installer]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wq-bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: wq-installer-windows-x64
          path: dist
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          gh release delete wq-dev --repo "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create wq-dev dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OMP-Wanwandequ rolling dev" \
            --notes "Standalone OMP-Wanwandequ build from $GITHUB_SHA for Windows, macOS and Linux (x64/arm64). Windows also has a click-to-install setup EXE. Model locked to DeepSeek V4 Flash. Configure credentials inside the agent with /wq-key and /wq-token." \
            --prerelease
