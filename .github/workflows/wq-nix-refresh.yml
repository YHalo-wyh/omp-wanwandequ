name: WQ Nix Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: wq-nix-refresh-generated
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wq/nix-refresh-generated
          fetch-depth: 0
      - uses: ./.github/actions/bun-install
      - name: Regenerate nix/bun.nix from bun.lock
        run: bun run gen:nix
      - name: Commit generated dependency map
        run: |
          if git diff --quiet -- bun.lock nix/bun.nix; then
            echo 'nix/bun.nix is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock nix/bun.nix
          git commit -m 'chore(nix): refresh bun2nix dependencies'
          git push origin HEAD:wq/nix-refresh-generated
