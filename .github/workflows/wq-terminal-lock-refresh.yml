name: WQ terminal lockfile refresh

on:
  push:
    branches:
      - wq/runtime-v1
    paths:
      - .github/workflows/wq-terminal-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Refresh workspace lockfile
        run: bun install --ignore-scripts --lockfile-only
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(wq): refresh lockfile after GUI removal"
          git push
