name: WQ Format Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: wq-format-refresh
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wq/format-refresh
          fetch-depth: 0
      - uses: ./.github/actions/bun-install
      - name: Apply repository TypeScript formatter
        run: bun run fmt:tools
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'formatter output is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages scripts
          git commit -m 'style: apply repository formatter'
          git push origin HEAD:wq/format-refresh
