name: WQ lockfile diagnostic

on:
  push:
    branches:
      - wq/runtime-v1
    paths:
      - .github/workflows/wq-lockfile-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Refresh lockfile only
        run: bun install --ignore-scripts --lockfile-only
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun workspace lockfile"
          git push origin HEAD:wq/runtime-v1
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
