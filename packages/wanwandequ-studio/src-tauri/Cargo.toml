[workspace]

[package]
name = "wanwandequ-studio"
version = "0.3.0"
description = "Lightweight desktop control center for OMP-Wanwandequ"
authors = ["YHalo-wyh"]
edition = "2021"

[lib]
name = "wanwandequ_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rfd = "0.15"
