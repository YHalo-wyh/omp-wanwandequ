[workspace]

[package]
name = "wanwandequ-studio"
version = "0.4.0"
description = "Desktop client for the Wanwandequ headless OMP runtime"
authors = ["YHalo-wyh"]
edition = "2021"

[lib]
name = "wanwandequ_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
